name: Xona Space Systems
description: 'Xona Space Systems builds Pulsar, a commercial low-Earth-orbit (LEO)
  positioning, navigation, and timing (PNT) satellite service designed to complement
  and harden GPS with centimeter-level accuracy and encrypted, jam-resistant signals
  usable by existing GNSS devices via software updates. The planned constellation
  is 258 small satellites at roughly 1,080 km altitude, with the Pulsar Verified
  ecosystem (receivers, simulators, test platforms) delivered through partners
  including Trimble, Septentrio, Topcon, Furuno, and Murata. A Craft Ventures
  portfolio company serving defense, agriculture, telecom, transportation,
  maritime, aviation, and autonomous systems. No public developer API surface
  was found as of July 2026.'
